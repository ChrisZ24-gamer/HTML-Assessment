<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Food Item</title>
</head>

<body>
    <div class="header"></div>
    <div class="main">
        <div class="container">
            <form action="">
                <h1>Add Food Item</h1>
                <hr>
                <table>

                    <tr>
                        <th colspan="2">Food Item Information</th>
                    </tr>

                    <tr>
                        <td><label for="fname">Food Item Name :</label></td>
                        <td><input type="text" name="fname" id="fname"></td>
                    </tr>
                   
                    <tr>
                        <td><label for="desc">Food Item Description :</label></td>
                        <td><textarea name="desc" id="desc" cols="30" rows="5"></textarea></td>
                    </tr>
                    <tr>
                        <td><label for="instock">Available?</label></td>
                        <td><input type="checkbox" name="instock" id="instock" value="yes"></td>
                    </tr>

                    <tr>
                        <td><label for="instock">Vegetarian?</label></td>
                        <td><input type="checkbox" name="instock" id="instock" value="yes"></td>
                    </tr>

                    <tr>
                        <td><label for="category">Category :</label></td>
                        <td><select name="category" id="category" multiple>
                                <option value="Paste">Pasta</option>
                                <option value="Pizza">Pizza</option>
                                <option value="Sandwich">Sandwich</option>
                                <option value="Soup">Soup</option>
                                
                            </select>
                           
                        </td>
                    </tr>

                    <tr></tr>
                        <td><label for="cuisine">Cuisine :</label></td>
                        <td><select name="cuisine" id="cuisine" multiple>
                                <option value="Italian">Italian</option>
                                <option value="Asian">Asian</option>
                                <option value="Chinese">Chinese</option>
                                
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="image
                            ">Image URL:</label>
                        </td>
                        <td><input type="text" name="image" id="image"></td>
                    </tr>


                    <tr>
                        <td><button type="cancel" class="discard">Discard</button></td>
                        <td><button type="submit" class="save">Save</button></td>
                    </tr>
                </table>
            </form>
        </div>
    </div>
    <div class="footer"></div>
</body>

</html>
